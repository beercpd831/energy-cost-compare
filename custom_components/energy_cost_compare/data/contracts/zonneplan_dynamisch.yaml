name: Zonneplan dynamisch
supplier: Zonneplan
kind: dynamic
checked_on: '2026-10-21'
confidence: estimate
sources:
- https://jeroen.nl/dynamische-energie/aanbieders
- https://zonnesaldo.nl/terugleverkosten-2027
note: Amounts from jeroen.nl (Oct 2026), taken as incl. VAT and converted. Markup
